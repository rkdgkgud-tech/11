name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          cat v3_0.b64 v3_1.b64 v3_2.b64 v3_3.b64 v3_4.b64 v3_5.b64 | base64 -d > project.zip
          unzip -q project.zip
          rm -f project.zip
          patch -p1 < v041.patch
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NasSwipeViewer-v0.4.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NasSwipeViewer-v0.4.1-APK
          path: NasSwipeViewer-v0.4.1.apk
          if-no-files-found: error
